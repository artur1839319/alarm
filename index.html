<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Alarm</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        h1 { font-size: 24px; margin-bottom: 10px; }
        .clock { font-size: 48px; font-weight: bold; margin: 20px 0; color: #00e676; }
        input[type="time"] {
            font-size: 28px;
            padding: 10px 20px;
            border-radius: 12px;
            border: none;
            background: #2c2c2c;
            color: white;
            margin-bottom: 20px;
        }
        button {
            font-size: 18px;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            background: #2979ff;
            color: white;
            width: 100%;
            max-width: 300px;
            margin: 8px 0;
        }
        button:active { transform: scale(0.98); }
        .hidden { display: none !important; }
        #video-container {
            position: relative;
            width: 100%;
            max-width: 320px;
            margin: 15px auto;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #ff1744;
        }
        video { width: 100%; display: block; transform: scaleX(-1); }
        .counter { font-size: 36px; font-weight: bold; color: #ffea00; margin: 10px 0; }
        .math-box { background: #1e1e1e; padding: 20px; border-radius: 16px; width: 100%; max-width: 300px; }
        input[type="number"] {
            font-size: 24px; padding: 10px; width: 120px; text-align: center;
            border-radius: 8px; border: none; margin: 10px 0;
        }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h1>⏰ Умный будильник</h1>
        <div class="clock" id="current-time">00:00:00</div>
        <p>Выбери время подъёма:</p>
        <input type="time" id="alarm-time" required>
        <br>
        <button onclick="setAlarm()">Включить будильник</button>
        <button style="background:#333; font-size:14px;" onclick="triggerAlarm()">Тест звонка прямо сейчас</button>
        <p id="status-text" style="color: #aaa; margin-top: 15px;"></p>
    </div>

    <div id="ringing-screen" class="hidden">
        <h1 style="color: #ff1744;">🚨 ПОДЪЁМ! 🚨</h1>
        <p id="task-desc">Сделай 10 отжиманий (или приседаний) перед камерой, чтобы выключить звук!</p>
        
        <div id="camera-mode">
            <div id="video-container">
                <video id="video" autoplay playsinline></video>
            </div>
            <div class="counter">Сделано: <span id="reps">0</span> / 10</div>
            <button style="background:#333; font-size:14px;" onclick="switchToMath()">Темно / нет камеры (Решить примеры)</button>
        </div>

        <div id="math-mode" class="hidden math-box">
            <p>Реши 3 примера, чтобы отключить:</p>
            <h2 id="math-question">15 + 27 = ?</h2>
            <input type="number" id="math-answer" placeholder="Ответ">
            <br>
            <button onclick="checkMath()">Ответить</button>
            <p>Решено: <span id="math-solved">0</span> / 3</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let alarmTime = null;
        let isRinging = false;
        let audioCtx = null;
        let beepInterval = null;
        let reps = 0;
        let mathSolved = 0;
        let currentAnswer = 0;

        setInterval(() => {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ');
            document.getElementById('current-time').innerText = timeStr;
            if (alarmTime && !isRinging && timeStr.startsWith(alarmTime) && now.getSeconds() === 0) {
                triggerAlarm();
            }
        }, 1000);

        function setAlarm() {
            const input = document.getElementById('alarm-time').value;
            if (!input) return alert('Сначала выбери время!');
            alarmTime = input;
            document.getElementById('status-text').innerText = `Будильник установлен на ${alarmTime}. Не закрывай окно!`;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function startSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            beepInterval = setInterval(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }, 600);
        }

        function stopSound() {
            clearInterval(beepInterval);
        }

        function triggerAlarm() {
            isRinging = true;
            reps = 0;
            mathSolved = 0;
            document.getElementById('reps').innerText = '0';
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('ringing-screen').classList.remove('hidden');
            startSound();
            startCameraTracking();
        }

        async function startCameraTracking() {
            const video = document.getElementById('video');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                let prevFrame = null;
                let movingDown = false;

                const detectInterval = setInterval(() => {
                    if (!isRinging) {
                        clearInterval(detectInterval);
                        stream.getTracks().forEach(t => t.stop());
                        return;
                    }
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                        canvas.width = 64;
                        canvas.height = 48;
                        ctx.drawImage(video, 0, 0, 64, 48);
                        const frame = ctx.getImageData(0, 0, 64, 48).data;
                        
                        if (prevFrame) {
                            let diff = 0;
                            for (let i = 0; i < frame.length; i += 16) {
                                diff += Math.abs(frame[i] - prevFrame[i]);
                            }
                            if (diff > 18000 && !movingDown) {
                                movingDown = true;
                            } else if (diff < 8000 && movingDown) {
                                movingDown = false;
                                reps++;
                                document.getElementById('reps').innerText = reps;
                                if (reps >= 10) finishAlarm();
                            }
                        }
                        prevFrame = frame;
                    }
                }, 200);
            } catch (e) {
                switchToMath();
            }
        }

        function switchToMath() {
            document.getElementById('camera-mode').classList.add('hidden');
            document.getElementById('math-mode').classList.remove('hidden');
            generateMath();
        }

        function generateMath() {
            const a = Math.floor(Math.random() * 40) + 15;
            const b = Math.floor(Math.random() * 40) + 15;
            currentAnswer = a + b;
            document.getElementById('math-question').innerText = `${a} + ${b} = ?`;
            document.getElementById('math-answer').value = '';
        }

        function checkMath() {
            const val = parseInt(document.getElementById('math-answer').value);
            if (val === currentAnswer) {
                mathSolved++;
                document.getElementById('math-solved').innerText = mathSolved;
                if (mathSolved >= 3) finishAlarm();
                else generateMath();
            } else {
                alert('Неверно! Попробуй ещё раз.');
            }
        }

        function finishAlarm() {
            isRinging = false;
            stopSound();
            alert('Отлично! Доброе утро, будильник выключен.');
            document.getElementById('ringing-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('status-text').innerText = '';
            alarmTime = null;
        }
    </script>
</body>
</html>
