<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Smart Alarm</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center; }
        .clock { font-size: 52px; font-weight: bold; margin: 15px 0; color: #00e676; }
        input[type="time"] { font-size: 28px; padding: 10px 20px; border-radius: 12px; border: none; background: #2c2c2c; color: #fff; margin-bottom: 12px; }
        .sound-row { display: flex; gap: 8px; width: 100%; max-width: 300px; margin: 0 auto 14px auto; }
        select { flex: 1; font-size: 15px; padding: 12px; border-radius: 12px; border: none; background: #2c2c2c; color: #fff; }
        button { font-size: 16px; font-weight: bold; padding: 14px 24px; border-radius: 12px; border: none; background: #2979ff; color: #fff; width: 100%; max-width: 300px; margin: 6px 0; }
        button:active { transform: scale(0.98); }
        .btn-green { background: #00c853; color: #000; }
        .btn-dark { background: #2c2c2c; }
        .hidden { display: none !important; }
        #video-container { width: 100%; max-width: 320px; margin: 15px auto; border-radius: 16px; overflow: hidden; border: 3px solid #ff1744; }
        video { width: 100%; display: block; transform: scaleX(-1); }
        .counter { font-size: 36px; font-weight: bold; color: #ffea00; margin: 10px 0; }
        .math-box { background: #1e1e1e; padding: 20px; border-radius: 16px; width: 100%; max-width: 300px; }
        input[type="number"] { font-size: 24px; padding: 10px; width: 120px; text-align: center; border-radius: 8px; border: none; margin: 10px 0; }
        .note { font-size: 12px; color: #888; max-width: 300px; margin-top: 10px; line-height: 1.4; }
    </style>
</head>
<body>
    <div id="setup-screen">
        <h1>⏰ Умный будильник</h1>
        <div class="clock" id="current-time">00:00:00</div>
        <input type="time" id="alarm-time" required>
        <div class="sound-row">
            <select id="melody-select">
                <option value="siren">🚨 Ядерная сирена</option>
                <option value="arcade">👾 Ретро-аркада</option>
                <option value="bell">🔔 Мягкий звон</option>
            </select>
            <button style="width:auto; padding:12px 16px; margin:0; background:#333;" onclick="previewSound()">🔊</button>
        </div>
        <button class="btn-green" onclick="addToCalendar()">📅 Поставить (работает в фоне)</button>
        <button onclick="setAlarm()">⏳ Таймер на экране (не закрывать)</button>
        <button class="btn-dark" onclick="triggerAlarm()">🚨 Тест звонка прямо сейчас</button>
        <p id="status-text" style="color: #00e676; margin-top: 12px; font-weight: bold; font-size: 14px;"></p>
        <p class="note">Зелёная кнопка добавит будильник в системный Календарь — он разбудит даже при заблокированном экране и откроет камеру для отжиманий.</p>
    </div>
    <div id="ringing-screen" class="hidden">
        <h1 style="color: #ff1744;">🚨 ПОДЪЁМ! 🚨</h1>
        <p>Сделай 10 отжиманий (или приседаний) перед камерой!</p>
        <div id="camera-mode">
            <div id="video-container"><video id="video" autoplay playsinline></video></div>
            <div class="counter">Сделано: <span id="reps">0</span> / 10</div>
            <button class="btn-dark" style="font-size:14px;" onclick="switchToMath()">Решить примеры вместо камеры</button>
        </div>
        <div id="math-mode" class="hidden math-box">
            <p>Реши 3 примера:</p>
            <h2 id="math-question">15 + 27 = ?</h2>
            <input type="number" id="math-answer" placeholder="Ответ"><br>
            <button onclick="checkMath()">Ответить</button>
            <p>Решено: <span id="math-solved">0</span> / 3</p>
        </div>
    </div>
    <script>
        if (window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.expand();
        let alarmTime = null, isRinging = false, audioCtx = null, beepInterval = null, reps = 0, mathSolved = 0, currentAnswer = 0, stepIndex = 0;

        window.addEventListener('DOMContentLoaded', () => {
            if (new URLSearchParams(window.location.search).get('ring') === '1') triggerAlarm();
        });

        setInterval(() => {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('current-time').innerText = h + ':' + m + ':' + s;
            if (alarmTime && !isRinging && (h + ':' + m) === alarmTime && s === '00') triggerAlarm();
        }, 1000);

        function pad(n) { return String(n).padStart(2, '0'); }

        function formatICSDate(d) {
            return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00';
        }

        function addToCalendar() {
            const input = document.getElementById('alarm-time').value;
            if (!input) return alert('Сначала выбери время подъёма!');
            const parts = input.split(':');
            const now = new Date();
            const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(parts[0]), parseInt(parts[1]), 0);
            if (target <= now) target.setDate(target.getDate() + 1);
            const end = new Date(target.getTime() + 10 * 60000);

            const ics = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//SmartAlarm//TelegramMiniApp//RU',
                'BEGIN:VEVENT',
                'DTSTART:' + formatICSDate(target),
                'DTEND:' + formatICSDate(end),
                'SUMMARY:🚨 ПОДЪЁМ! 10 отжиманий',
                'DESCRIPTION:Нажми на ссылку, чтобы выключить сирену: https://github.io',
                'URL:https://github.io',
                'BEGIN:VALARM',
                'TRIGGER:-PT0M',
                'ACTION:DISPLAY',
                'DESCRIPTION:ПОДЪЁМ!',
                'END:VALARM',
                'BEGIN:VALARM',
                'TRIGGER:PT1M',
                'ACTION:DISPLAY',
                'DESCRIPTION:ВСТАВАЙ! 10 отжиманий!',
                'END:VALARM',
                'END:VEVENT',
                'END:VCALENDAR'
            ].join('\r\n');

            const dataUri = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
                window.Telegram.WebApp.openLink(dataUri);
            } else {
                window.location.href = dataUri;
            }
            document.getElementById('status-text').innerText = '✅ Нажми «Добавить» в открывшемся окне Календаря!';
        }

        function unlockAudio() {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!audioCtx) audioCtx = new AC();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playToneStep() {
            if (!audioCtx) return;
            const type = document.getElementById('melody-select').value;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const now = audioCtx.currentTime;
            osc.type = type === 'bell' ? 'sine' : (type === 'arcade' ? 'square' : 'sawtooth');
            let freq = stepIndex % 2 === 0 ? 980 : 720;
            if (type === 'arcade') freq = (stepIndex % 2 === 0 ? 523 : 784);
            if (type === 'bell') freq = (stepIndex % 2 === 0 ? 880 : 1108);
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.45, now);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
            stepIndex++;
        }

        function previewSound() {
            unlockAudio(); stepIndex = 0; playToneStep();
            setTimeout(playToneStep, 280);
        }

        function setAlarm() {
            const input = document.getElementById('alarm-time').value;
            if (!input) return alert('Сначала выбери время!');
            unlockAudio();
            alarmTime = input;
            document.getElementById('status-text').innerText = '✅ Таймер запущен на ' + alarmTime + ' (не закрывай экран)';
        }

        function triggerAlarm() {
            isRinging = true; reps = 0; mathSolved = 0;
            document.getElementById('reps').innerText = '0';
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('ringing-screen').classList.remove('hidden');
            unlockAudio(); stepIndex = 0; playToneStep();
            beepInterval = setInterval(() => { if (isRinging) playToneStep(); }, 400);
            startCameraTracking();
        }

        async function startCameraTracking() {
            const video = document.getElementById('video');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                let prevFrame = null, movingDown = false;
                const det = setInterval(() => {
                    if (!isRinging) { clearInterval(det); stream.getTracks().forEach(t => t.stop()); return; }
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                        canvas.width = 64; canvas.height = 48;
                        ctx.drawImage(video, 0, 0, 64, 48);
                        const frame = ctx.getImageData(0, 0, 64, 48).data;
                        if (prevFrame) {
                            let diff = 0;
                            for (let i = 0; i < frame.length; i += 16) diff += Math.abs(frame[i] - prevFrame[i]);
                            if (diff > 18000 && !movingDown) movingDown = true;
                            else if (diff < 8000 && movingDown) {
                                movingDown = false; reps++;
                                document.getElementById('reps').innerText = reps;
                                if (reps >= 10) finishAlarm();
                            }
                        }
                        prevFrame = frame;
                    }
                }, 200);
            } catch (e) { switchToMath(); }
        }

        function switchToMath() {
            document.getElementById('camera-mode').classList.add('hidden');
            document.getElementById('math-mode').classList.remove('hidden');
            generateMath();
        }

        function generateMath() {
            const a = Math.floor(Math.random() * 40) + 15;
            const b = Math.floor(Math.random() * 40) + 15;
            currentAnswer = a + b;
            document.getElementById('math-question').innerText = a + ' + ' + b + ' = ?';
            document.getElementById('math-answer').value = '';
        }

        function checkMath() {
            if (parseInt(document.getElementById('math-answer').value) === currentAnswer) {
                mathSolved++;
                document.getElementById('math-solved').innerText = mathSolved;
                if (mathSolved >= 3) finishAlarm(); else generateMath();
            } else alert('Неверно!');
        }

        function finishAlarm() {
            isRinging = false; clearInterval(beepInterval);
            alert('Отлично! Доброе утро!');
            document.getElementById('ringing-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('status-text').innerText = '';
            alarmTime = null;
        }
    </script>
</body>
</html>
